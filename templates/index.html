<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Modulações</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f4f4;

            margin: 0;

            padding: 40px;
        }

        .container {

            max-width: 700px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {

            text-align: center;

            margin-bottom: 30px;
        }

        .campo {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        select,
        input,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 14px;
        }

        textarea {

            resize: vertical;

            min-height: 100px;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            background: #007bff;

            color: white;

            font-size: 16px;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {

            background: #0056b3;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Formulário de Modulações</h1>

        <form id="formulario">

            <!-- FEIRA -->
            <div class="campo">

                <label>Feira / Coleção</label>

                <select id="modelo" required>

                    <option value="">
                        Selecione
                    </option>

                </select>

            </div>


            <!-- PRODUTO -->
            <div class="campo">

                <label>Produto</label>

                <select id="modulacao" required>

                    <option value="">
                        Selecione
                    </option>

                </select>

            </div>


            <!-- MODULACAO -->
            <div class="campo">

                <label>Modulação</label>

                <select id="variavel" required>

                    <option value="">
                        Selecione
                    </option>

                </select>

            </div>


            <!-- SETOR -->
            <div class="campo">

                <label>Setor</label>

                <input
                    type="text"
                    id="setor"
                    required
                >

            </div>


            <!-- VERSAO -->
            <div class="campo">

                <label>Versão</label>

                <input
                    type="text"
                    id="versao"
                    required
                >

            </div>


            <!-- MELHORIA -->
            <div class="campo">

                <label>Melhoria</label>

                <input
                    type="text"
                    id="melhoria"
                    required
                >

            </div>


            <!-- DESCRICAO -->
            <div class="campo">

                <label>Descrição</label>

                <textarea
                    id="descricao"
                    required
                ></textarea>

            </div>


            <!-- BOTAO -->
            <button type="submit">

                Salvar Registro

            </button>

        </form>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
