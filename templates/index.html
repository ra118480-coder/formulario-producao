<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Produção</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin:0;
            padding:0;
        }

        .container{
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        label{
            font-weight:bold;
            margin-top:15px;
            display:block;
        }

        select,
        textarea,
        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            border-radius:8px;
            border:1px solid #ccc;
            box-sizing:border-box;
        }

        textarea{
            min-height:100px;
        }

        button{
            margin-top:20px;
            padding:12px 20px;
            border:none;
            border-radius:8px;
            background:#1f6feb;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#174ea6;
        }

        .bloco{
            margin-top:30px;
            padding:20px;
            border:1px solid #ddd;
            border-radius:10px;
            background:#fafafa;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Formulário Produção</h1>

    <form action="/salvar" method="POST" enctype="multipart/form-data">

        <!-- FEIRA -->

        <label>Feira</label>

        <select name="feira" id="feira" required>
            <option value="">Selecione</option>
        </select>

        <!-- PRODUTO -->

        <label>Produto</label>

        <select name="produto" id="produto" required>
            <option value="">Selecione</option>
        </select>

        <!-- MODULAÇÃO -->

        <label>Modulação</label>

        <select name="modulacao" id="modulacao" required>
            <option value="">Selecione</option>
        </select>

        <!-- VERSÃO -->

        <label>Versão</label>

        <select name="versao" required>

            <option value="">Selecione</option>

            <option value="V1">V1</option>
            <option value="V2">V2</option>
            <option value="V3">V3</option>
            <option value="V4">V4</option>
            <option value="V5">V5</option>

        </select>

        <!-- FASE -->

        <label>Fase</label>

        <select name="fase" required>

            <option value="">Selecione</option>

            <option value="Montagem">Montagem</option>
            <option value="Espumação">Espumação</option>
            <option value="Tapeçaria">Tapeçaria</option>
            <option value="Costura">Costura</option>

        </select>

        <!-- TIPO -->

        <label>Tipo</label>

        <select name="tipo" required>

            <option value="">Selecione</option>

            <option value="Informacional">Informacional</option>
            <option value="Melhoria">Melhoria</option>

        </select>

        <!-- DESCRIÇÕES -->

        <div id="descricoes">

            <div class="bloco">

                <label>Descrição 1</label>

                <textarea
                    name="descricao_1"
                    required
                ></textarea>

                <label>Foto 1</label>

                <input
                    type="file"
                    name="foto_1"
                    accept="image/*"
                >

            </div>

        </div>

        <!-- BOTÃO ADICIONAR -->

        <button
            type="button"
            onclick="adicionarDescricao()"
        >
            Adicionar descrição/foto
        </button>

        <br>

        <!-- SALVAR -->

        <button type="submit">
            Salvar Formulário
        </button>

    </form>

</div>

<script>

    let contador = 1;

    // =========================
    // CARREGAR FEIRAS
    // =========================

    fetch("/feiras")
    .then(res => res.json())
    .then(data => {

        let feira = document.getElementById("feira");

        data.forEach(item => {

            feira.innerHTML += `
                <option value="${item}">
                    ${item}
                </option>
            `;

        });

    });

    // =========================
    // CARREGAR PRODUTOS
    // =========================

    document
    .getElementById("feira")
    .addEventListener("change", function(){

        let feira = this.value;

        fetch("/produtos/" + feira)
        .then(res => res.json())
        .then(data => {

            let produto = document.getElementById("produto");

            produto.innerHTML =
                `<option value="">Selecione</option>`;

            data.forEach(item => {

                produto.innerHTML += `
                    <option value="${item}">
                        ${item}
                    </option>
                `;

            });

        });

    });

    // =========================
    // CARREGAR MODULAÇÕES
    // =========================

    document
    .getElementById("produto")
    .addEventListener("change", function(){

        let produto = this.value;

        fetch("/modulacoes/" + produto)
        .then(res => res.json())
        .then(data => {

            let modulacao =
                document.getElementById("modulacao");

            modulacao.innerHTML =
                `<option value="">Selecione</option>`;

            data.forEach(item => {

                modulacao.innerHTML += `
                    <option value="${item}">
                        ${item}
                    </option>
                `;

            });

        });

    });

    // =========================
    // ADICIONAR DESCRIÇÕES
    // =========================

    function adicionarDescricao(){

        contador++;

        let div =
            document.getElementById("descricoes");

        div.innerHTML += `

            <div class="bloco">

                <label>
                    Descrição ${contador}
                </label>

                <textarea
                    name="descricao_${contador}"
                ></textarea>

                <label>
                    Foto ${contador}
                </label>

                <input
                    type="file"
                    name="foto_${contador}"
                    accept="image/*"
                >

            </div>

        `;

    }

</script>

</body>
</html>
