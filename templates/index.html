<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Formulário Industrial</title>
</head>

<body>

<h2>Formulário de Produção</h2>

<form id="formulario">

<!-- FEIRA -->
<select name="feira" id="feira"></select>

<!-- PRODUTO -->
<select name="produto" id="produto"></select>

<!-- MODULAÇÃO -->
<select name="modulacao" id="modulacao"></select>

<!-- FASE -->
<select name="fase">
  <option>Montagem</option>
  <option>Espumação</option>
  <option>Tapeçaria</option>
</select>

<!-- TIPO -->
<select name="melhoria">
  <option>Informacional</option>
  <option>Melhoria</option>
</select>

<hr>

<!-- DESCRIÇÕES MÚLTIPLAS -->
<div id="descricoes">
  <input name="descricao_1" placeholder="Descrição 1">
</div>

<button type="button" onclick="addDescricao()">+ adicionar descrição</button>

<hr>

<!-- FOTOS MÚLTIPLAS -->
<div id="fotos">
  <input type="file" name="foto_1">
</div>

<button type="button" onclick="addFoto()">+ adicionar foto</button>

<hr>

<button type="submit">Salvar</button>

</form>

<script src="/static/script.js"></script>

</body>
</html>
