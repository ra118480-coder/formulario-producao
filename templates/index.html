<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Formulário Produção</title>

<style>

body{
    font-family: Arial;
    background:#f4f4f4;
    padding:30px;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

label{
    font-weight:bold;
    margin-top:15px;
    display:block;
}

select,input,textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    margin-top:20px;
    padding:12px;
    border:none;
    background:#007bff;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.bloco{
    margin-top:20px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h2>Formulário de Produção</h2>

<form id="formulario" enctype="multipart/form-data">

<label>Feira</label>
<select id="feira" name="feira"></select>

<label>Produto</label>
<select id="produto" name="produto"></select>

<label>Modulação</label>
<select id="modulacao" name="modulacao"></select>

<label>Versão</label>
<select name="versao">

<option>V1</option>
<option>V2</option>
<option>V3</option>
<option>V4</option>
<option>V5</option>

</select>

<label>Fase</label>
<select name="fase">

<option>Montagem</option>
<option>Espumação</option>
<option>Tapeçaria</option>

</select>

<label>Tipo</label>
<select name="melhoria">

<option>Informacional</option>
<option>Melhoria</option>

</select>

<div id="campos"></div>

<button type="button" onclick="adicionarCampo()">
Adicionar descrição/foto
</button>

<button type="submit">
Salvar
</button>

</form>

</div>

<script src="/static/script.js"></script>

</body>
</html>
