<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<title>Formulário</title>
<style>

body { font-family: Arial; background:#f4f4f4; padding:30px; }

.container {
    max-width: 800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

select, input, textarea {
    width:100%;
    padding:10px;
    margin-top:5px;
}

.campo { margin-bottom:15px; }

button {
    width:100%;
    padding:12px;
    background:blue;
    color:white;
    border:none;
}

</style>
</head>

<body>

<div class="container">

<h2>Formulário de Modulações</h2>

<form id="formulario" enctype="multipart/form-data">

<!-- FEIRA -->
<div class="campo">
<label>Feira</label>
<select id="modelo" name="feira"></select>
</div>

<!-- PRODUTO -->
<div class="campo">
<label>Produto</label>
<select id="modulacao" name="produto"></select>
</div>

<!-- MODULAÇÃO -->
<div class="campo">
<label>Modulação</label>
<select id="variavel" name="modulacao"></select>
</div>

<!-- SETOR -->
<div class="campo">
<label>Setor</label>
<select name="setor">
<option>Madeira</option>
<option>Espuma</option>
<option>Tecido</option>
</select>
</div>

<!-- CLASSIFICAÇÃO -->
<div class="campo">
<label>Classificação</label>
<select name="classificacao">
<option>Produto em linha</option>
<option>Validação</option>
</select>
</div>

<!-- TIPO -->
<div class="campo">
<label>Tipo</label>
<select name="melhoria">
<option>Informacional</option>
<option>Melhoria</option>
</select>
</div>

<!-- DESCRIÇÃO -->
<div class="campo">
<label>Descrição</label>
<textarea name="descricao"></textarea>
</div>

<!-- FOTO -->
<div class="campo">
<label>Imagem</label>
<input type="file" name="imagem">
</div>

<button type="submit">Salvar</button>

</form>

</div>

<script src="/static/script.js"></script>

</body>

</html>
