<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Modulações</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 30px;
        }

        .container {
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        .campo {
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }

        button {
            padding: 10px;
            width: 100%;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        .comentarios {
            margin-top: 10px;
        }

        .comentario-item {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .comentario-item input {
            flex: 1;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Formulário de Modulações</h2>

    <form id="formulario">

        <!-- FEIRA -->
        <div class="campo">
            <label>Feira</label>
            <select id="modelo"></select>
        </div>

        <!-- PRODUTO -->
        <div class="campo">
            <label>Produto</label>
            <select id="modulacao"></select>
        </div>

        <!-- MODULAÇÃO -->
        <div class="campo">
            <label>Modulação</label>
            <select id="variavel"></select>
        </div>

        <!-- SETOR -->
        <div class="campo">
            <label>Setor</label>
            <select id="setor">
                <option>Produção</option>
                <option>Engenharia</option>
                <option>Qualidade</option>
                <option>Comercial</option>
            </select>
        </div>

        <!-- VERSÃO -->
        <div class="campo">
            <label>Versão</label>
            <select id="versao">
                <option>1.0</option>
                <option>1.1</option>
                <option>2.0</option>
                <option>3.0</option>
            </select>
        </div>

        <!-- MELHORIA -->
        <div class="campo">
            <label>Melhoria</label>
            <select id="melhoria">
                <option>Sim</option>
                <option>Não</option>
            </select>
        </div>

        <!-- COMENTÁRIOS MÚLTIPLOS -->
        <div class="campo">

            <label>Comentários</label>

            <div id="comentarios" class="comentarios"></div>

            <button type="button" onclick="adicionarComentario()">
                + Adicionar comentário
            </button>

        </div>

        <!-- DESCRIÇÃO -->
        <div class="campo">
            <label>Descrição Geral</label>
            <textarea id="descricao"></textarea>
        </div>

        <!-- FOTO -->
        <div class="campo">
            <label>Imagem (opcional)</label>
            <input type="file" id="imagem" accept="image/*">
        </div>

        <button type="submit">Salvar</button>

    </form>

</div>

<script src="/static/script.js"></script>

<script>

function adicionarComentario() {

    const div = document.getElementById("comentarios")

    const input = document.createElement("input")

    input.type = "text"

    input.placeholder = "Digite um comentário"

    div.appendChild(input)
}

</script>

</body>

</html>
