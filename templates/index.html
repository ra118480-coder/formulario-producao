<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Formulário de Modulações</title>

<style>

body {
    font-family: Arial;
    background: #f4f4f4;
    padding: 30px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

.campo {
    margin-bottom: 15px;
}

label {
    font-weight: bold;
}

select, input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
}

.bloco {
    border: 1px solid #ddd;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 8px;
    background: #fafafa;
}

button {
    padding: 10px;
    width: 100%;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
}

.add {
    background: green;
    margin-top: 5px;
}

</style>

</head>

<body>

<div class="container">

<h2>Formulário de Modulações</h2>

<form id="formulario">

<!-- FEIRA -->
<div class="campo">
<label>Feira</label>
<select id="modelo"></select>
</div>

<!-- PRODUTO -->
<div class="campo">
<label>Produto</label>
<select id="modulacao"></select>
</div>

<!-- MODULAÇÃO -->
<div class="campo">
<label>Modulação</label>
<select id="variavel"></select>
</div>

<!-- SETOR -->
<div class="campo">
<label>Setor</label>
<select id="setor">

<option>Madeira</option>
<option>Espuma</option>
<option>Tecido</option>

</select>
</div>

<!-- CLASSIFICAÇÃO -->
<div class="campo">
<label>Classificação de Alteração</label>
<select id="classificacao">

<option>Produto em linha</option>
<option>Validação</option>

</select>
</div>

<!-- MELHORIA -->
<div class="campo">
<label>Tipo</label>
<select id="melhoria">

<option>Informacional</option>
<option>Melhoria</option>

</select>
</div>

<!-- BLOCOS DINÂMICOS -->
<div class="campo">
<label>Comentários + Fotos</label>

<div id="blocos"></div>

<button type="button" class="add" onclick="addBloco()">
Adicionar novo bloco
</button>

</div>

<button type="submit">Salvar</button>

</form>

</div>

<script>

function addBloco() {

const div = document.getElementById("blocos")

const bloco = document.createElement("div")

bloco.className = "bloco"

bloco.innerHTML = `

<textarea placeholder="Comentário"></textarea>

<input type="file" accept="image/*">

`

div.appendChild(bloco)

}

// adicionar primeiro bloco automático
addBloco()

</script>

<script src="/static/script.js"></script>

</body>

</html>
